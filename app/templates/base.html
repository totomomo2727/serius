<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <meta name="description" content="A daily newspaper, curated for you.">
  <link rel="stylesheet" href="/static/press.css">
  <link rel="icon" href="/static/seagull.svg" type="image/svg+xml">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    {% block masthead %}
    <header class="masthead">
      <a class="wordmark" href="/">
        <span class="wordmark-the">The</span>
        <span class="wordmark-name">Feather Press</span>
      </a>
      <p class="wordmark-line">Three good finds. Delivered daily.</p>
    </header>
    <hr class="rule">
    {% endblock %}
    <main id="main">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      <p>{{ app_name }} &middot; no account, no password, unsubscribe from any edition.</p>
      {% if dev_tools %}<p class="footer-dev"><a href="/dev">Development controls</a></p>{% endif %}
    </footer>
  </div>
</body>
</html>
