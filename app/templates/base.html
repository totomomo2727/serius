<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <meta name="description" content="Three good finds. Delivered daily.">
  <script>
    /* Hiding for the reveal is only applied while a live script is there to
       undo it: if press.js never runs, the page shows itself. */
    document.documentElement.className += ' js';
    setTimeout(function () {
      if (document.documentElement.dataset.motion !== 'ready') {
        document.documentElement.classList.remove('js');
      }
    }, 2500);
  </script>
  <link rel="stylesheet" href="/static/press/fonts.css">
  <link rel="stylesheet" href="/static/press/style.css">
  <link rel="stylesheet" href="/static/press/product.css">
  <link rel="icon" href="/static/seagull.svg" type="image/svg+xml">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav">
    <a class="brand" href="/">THE FEATHER PRESS<span>BY SERIUS</span></a>
    <nav>
      <a href="/sample">A sample edition ↗</a>
      <a class="nav-cta" href="/start">Meet your curator ↗</a>
      <button class="sound-toggle" type="button" data-sound-toggle aria-pressed="false"
              hidden>Sound <span data-sound-state>off</span></button>
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-foot">
    <p>{{ app_name }} &middot; curated by Serius &middot; no account, no password, unsubscribe from any edition.</p>
    {% if dev_tools %}<p class="footer-dev"><a href="/dev">Development controls</a></p>{% endif %}
  </footer>
  <script src="/static/press/press.js" defer></script>
</body>
</html>
