services:
  - type: web
    name: feather-press
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        value: sqlite:////var/data/feather.db
      - key: EMAIL_PROVIDER
        value: auto
      - key: RESEND_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: ASSET_BASE_URL
        sync: false
      - key: EMAIL_ALLOWED_RECIPIENTS
        sync: false
    disk:
      name: feather-data
      mountPath: /var/data
      sizeGB: 1
